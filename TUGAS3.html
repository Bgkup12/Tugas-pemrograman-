<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAIRUL AKBAR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cek Bilangan Genap atau Ganjil</h2>
        <form id="bilanganForm">
            <label for="bilangan">Masukkan Bilangan:</label>
            <input type="number" id="bilangan" placeholder="Masukkan bilangan" required>

            <button type="button" onclick="cekBilangan()">Cek Bilangan</button>
        </form>

        <div class="result" id="hasil"></div>
    </div>

    <script>
        function cekBilangan() {
            // Ambil nilai bilangan dari input
            const bilangan = parseInt(document.getElementById('bilangan').value);

            // Periksa apakah input valid
            if (isNaN(bilangan)) {
                document.getElementById('hasil').textContent = "Masukkan bilangan yang valid!";
                return;
            }

            // Tentukan genap atau ganjil
            const hasil = (bilangan % 2 === 0) ? "Bilangan Genap" : "Bilangan Ganjil";

            // Tampilkan hasil
            document.getElementById('hasil').textContent = `${bilangan} adalah ${hasil}.`;
        }
    </script>
</body>
</html>
